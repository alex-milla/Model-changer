# Configuración del gestor de modelos Llama.cpp
# Ajusta las rutas a tu equipo Ubuntu antes de arrancar.

# Binario llama-server compilado con soporte CUDA
llama_server_bin: /opt/llama.cpp/build/bin/llama-server

# Carpeta donde guardas los modelos .gguf
models_dir: /mnt/models

# Argumentos que se pasan siempre a llama-server
llama_host: 0.0.0.0
llama_port: 8080
ctx_size: 8192
n_gpu_layers: 999
threads: 8

# Puerto y host del panel web de cambio de modelos
manager_host: 0.0.0.0
manager_port: 8081

# Archivo de perfiles de arranque por modelo.
# Las rutas relativas se resuelven respecto al directorio donde esté config.yaml.
profiles_path: ./model_profiles.yaml

# Directorio para logs del gestor.
# Las rutas relativas se resuelven respecto al directorio donde esté config.yaml.
log_dir: ./logs

# --- Actualizaciones desde GitHub ---
# Repositorio de donde descargar las releases (tag vX.Y.Z + GitHub Release).
update_repo_owner: alex-milla
update_repo_name: Model-changer

# Carpeta de backups del código antes de cada actualización/restauración.
# Las rutas relativas se resuelven respecto al directorio donde esté config.yaml.
backups_dir: ./backups

# Token de GitHub OPCIONAL (solo sube el rate limit o repos privados).
# Se lee de la variable de entorno GITHUB_TOKEN o de un fichero en env/
# (p. ej. env/github.token). Nunca lo pongas dentro del repo.

